[project]
name = "hsw-vision"
version = "0.1.0"
description = "Vision sidecar for hsw-editor: orchestration (HTTP, model manager, cache, proposals) over the threed-vision library."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.24",
    # All vision algorithms live in 3d-cli (single source of truth); this service only orchestrates them.
    # Core deps only (numpy, opencv, pillow, scipy). The heavy runtime (torch cu128, onnxruntime-gpu 1.23.2, sam2,
    # transformers, cma, trimesh) is NOT a locked extra: `hsw-editor vision setup` installs it into the vision venv
    # (docs/vision.md "Install"), which keeps this lockfile small enough for the review gate and CI light.
    "threed-vision",
]

[project.scripts]
hsw-vision = "hsw_vision.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.uv.sources]
threed-vision = { git = "https://github.com/alex-mextner/3d-cli", subdirectory = "packages/threed-vision", rev = "0eddb522ee752362208efb74d1792a4365001264" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_photo: needs the private HSW photos (skipped when absent)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsw_vision"]
