[project]
name = "hsw-vision"
version = "0.1.0"
description = "Vision sidecar for hsw-editor: detect, segment, calibrate, fit, retrieve."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsw_vision"]
